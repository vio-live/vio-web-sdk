type PaymentMutations {
  """Confirms a payment session with Apple Pay."""
  ConfirmPaymentApplePay(
    """Token generated by the Apple Pay SDK."""
    apple_pay_token: String!

    """Unique identifier for the checkout session."""
    checkout_id: String!

    """Email address of the buyer."""
    email: String

    """Shipping address chosen by the buyer."""
    shipping_address: ApplePayAddressInput
  ): ConfirmPaymentApplePayDTO!

  """Confirms a payment session with Google Pay."""
  ConfirmPaymentGooglePay(
    """Unique identifier for the checkout session."""
    checkout_id: String!

    """Email address of the buyer."""
    email: String

    """Token generated by the Google Pay SDK."""
    google_pay_token: String!

    """Shipping address chosen by the buyer."""
    shipping_address: GooglePayAddressInput
  ): ConfirmPaymentGooglePayDTO!

  """Confirms a Klarna native payment using an authorization token."""
  ConfirmPaymentKlarnaNative(
    """Authorization token returned by the Klarna SDK."""
    authorization_token: String!

    """Whether to auto capture the payment (overrides init setting)."""
    auto_capture: Boolean
    billing_address: KlarnaNativeAddressInput

    """Checkout identifier used during initialization."""
    checkout_id: String!
    customer: KlarnaNativeCustomerInput
    shipping_address: KlarnaNativeAddressInput
  ): ConfirmPaymentKlarnaNativeDTO!

  """Initializes a payment session with Apple Pay."""
  CreatePaymentApplePay(
    """Unique identifier for the checkout session."""
    checkout_id: String!
  ): InitPaymentApplePayDTO!

  """Initializes a payment session with Google Pay."""
  CreatePaymentGooglePay(
    """Unique identifier for the checkout session."""
    checkout_id: String!
  ): InitPaymentGooglePayDTO!

  """Creates a payment intent in Stripe for the specified checkout."""
  CreatePaymentIntentStripe(
    """Unique identifier for the Stripe checkout session."""
    checkout_id: String!

    """Indicates whether to return an ephemeral key for the payment intent."""
    return_ephemeral_key: Boolean
  ): PaymentIntentStripeDTO!

  """Initializes a payment session with Klarna."""
  CreatePaymentKlarna(
    """Unique identifier for the Klarna checkout session."""
    checkout_id: String!

    """Country code (ISO 3166-1 alpha-2) for the payment."""
    country_code: String!

    """Email address of the user initiating the payment."""
    email: String

    """URL to redirect after completing the payment."""
    href: String!
  ): InitPaymentKlarnaDTO!

  """Initializes a payment session with Klarna using the native SDK flow."""
  CreatePaymentKlarnaNative(
    """Whether to auto capture the payment. Overrides intent when provided."""
    auto_capture: Boolean
    billing_address: KlarnaNativeAddressInput

    """Unique identifier for the Klarna checkout session."""
    checkout_id: String!

    """Country code (ISO 3166-1 alpha-2)."""
    country_code: String

    """Currency code (ISO 4217)."""
    currency: String
    customer: KlarnaNativeCustomerInput

    """Intent for Klarna session (CAPTURE or AUTHORIZE)."""
    intent: String

    """Locale to be used by Klarna."""
    locale: String

    """Return URL after payment completion."""
    return_url: String
    shipping_address: KlarnaNativeAddressInput
  ): InitPaymentKlarnaNativeDTO!

  """Initializes a payment session with Stripe."""
  CreatePaymentStripe(
    """Unique identifier for the Stripe checkout session."""
    checkout_id: String!

    """Email address of the user initiating the payment."""
    email: String!

    """Payment method to be used for the Stripe transaction."""
    payment_method: String!

    """URL to redirect the user upon successful payment completion."""
    success_url: String!
  ): InitPaymentStripeDTO!

  """Initializes a payment session with Vipps."""
  CreatePaymentVipps(
    """Checkout id."""
    checkout_id: String!

    """Customer's email."""
    email: String!

    """Return url after payment"""
    return_url: String!
  ): InitPaymentVippsDTO!
}

